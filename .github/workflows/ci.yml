name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 22 is the floor for the full suite: the bridge and CDP clients
        # use the global WebSocket class, which only exists from Node 22.
        # The plugin runtime itself supports Node 20.
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Verify the MCP server answers a raw JSON-RPC call
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node src/mcp/cli.js \
            | grep -q '"r7_inspect"'
